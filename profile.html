<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My profile</title>
<link rel="icon" type="image/png" href="assets/images/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
<style>
  .profile-page{position:relative;z-index:1;min-height:100svh;display:grid;place-items:center;padding:6rem 1.5rem 3rem}
  .profile-card{width:min(100%,620px);overflow:hidden;background:linear-gradient(145deg,rgba(19,29,61,.96),rgba(10,15,34,.98));border:1px solid var(--border);border-radius:18px;box-shadow:0 30px 70px -42px rgba(0,0,0,.9)}
  .profile-top{padding:1.25rem 1.6rem 0}.profile-hero{display:flex;align-items:center;gap:1rem;padding:1.5rem 0 1.35rem;border-bottom:1px solid var(--border)}
  .profile-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:rgba(19,29,61,.8);border:1px solid rgba(125,178,255,.35);box-shadow:0 0 0 5px rgba(79,141,255,.07)}
  .profile-avatar-icon{display:grid;place-items:center;color:var(--text-dim)}.profile-avatar-icon svg{width:23px;height:23px;fill:#9aa7c7}
  .profile-kicker{margin-bottom:.15rem;color:var(--cyan);font:500 .7rem var(--font-mono);letter-spacing:.07em;text-transform:uppercase}.profile-head h1{font-size:1.35rem;line-height:1.2}.profile-head p{font-family:var(--font-mono);font-size:.76rem;color:var(--text-faint);overflow-wrap:anywhere}
  .profile-form{padding:1.45rem 1.6rem 0;display:grid;grid-template-columns:1fr;gap:1.1rem}.profile-form label{gap:.45rem}.profile-form input[readonly]{color:var(--text-faint);cursor:not-allowed}
  .profile-photo-control{grid-column:1/-1;padding:1rem;border:1px solid var(--border);border-radius:12px;background:rgba(6,10,22,.28)}.profile-photo-control label{display:flex}.profile-photo-input{font:inherit;font-size:.82rem}.profile-photo-input::file-selector-button{margin-right:.7rem;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--text);padding:.45rem .65rem;font:inherit;cursor:pointer}
  .profile-photo-help{margin-top:.5rem;font:400 .7rem/1.6 var(--font-mono);color:var(--text-faint)}.profile-default-avatar{margin-top:.7rem!important;width:auto!important;padding:.45rem .72rem!important;border:1px solid var(--border)!important;background:transparent!important;color:var(--text-dim)!important}.profile-default-avatar:hover{border-color:var(--cyan)!important;color:var(--cyan)!important}
  .profile-form .profile-save{grid-column:1/-1;margin-top:.1rem!important}.profile-status{grid-column:1/-1;min-height:1.2rem;margin-top:-.5rem}.profile-footer{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:1.45rem 1.6rem 1.6rem;padding-top:1.1rem;border-top:1px solid var(--border)}.profile-footer p{font:.72rem var(--font-mono);color:var(--text-faint)}.profile-logout{padding:.55rem .85rem!important;color:var(--text-dim)!important}.profile-logout:hover{border-color:#ff6b6b!important;color:#ff8888!important}
  @media(max-width:560px){.profile-page{padding:4.5rem 1rem 2rem}.profile-top{padding:1rem 1.2rem 0}.profile-form{padding:1.2rem 1.2rem 0;grid-template-columns:1fr}.profile-form label{grid-column:1/-1}.profile-footer{margin:1.2rem;padding-top:1rem}.profile-footer p{display:none}}
</style>
</head>
<body>
<canvas id="net-bg"></canvas>
<main class="profile-page">
  <section class="profile-card">
    <div class="profile-top">
    <a href="index.html" class="auth-back">← back to site</a>
    <div class="profile-hero">
      <div id="profileAvatar" class="profile-avatar profile-avatar-icon" role="img" aria-label="Default profile avatar">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 1 0 8Zm0 2c-4.1 0-7 2-7 4.5V20h14v-1.5c0-2.5-2.9-4.5-7-4.5Z"/></svg>
      </div>
      <div class="profile-head"><p class="profile-kicker">Account settings</p><h1 id="profileName">My profile</h1><p id="profileUsername">Loading…</p></div>
    </div>
    </div>
    <form id="profileForm" class="auth-form profile-form">
      <label>Username <input id="username" type="text" readonly /></label>
      <label>Display name <input id="displayName" type="text" required maxlength="60" autocomplete="name" /></label>
      <div class="profile-photo-control"><label>Profile photo <input id="avatarInput" class="profile-photo-input" type="file" accept="image/jpeg,image/png,image/webp" /></label><button type="button" class="btn btn-ghost profile-default-avatar" id="useDefaultAvatarBtn">Use default avatar</button><p class="profile-photo-help">Upload a JPG, PNG, or WebP up to 5 MB. It will be cropped and compressed before saving.</p></div>
      <button type="submit" class="btn btn-primary profile-save" id="saveProfileBtn">Save changes</button>
      <p class="form-status profile-status" id="profileStatus" aria-live="polite"></p>
    </form>
    <div class="profile-footer"><p>Changes are saved securely to your account.</p><button type="button" class="btn btn-ghost profile-logout" id="logoutBtn">Log out</button></div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
