<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — JHAZZ Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/animations.css" />
<style>
  body{ padding:2rem 1.5rem 4rem; }
  .dash-wrap{ position:relative; z-index:1; max-width:1100px; margin:0 auto; }
  .dash-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:1.6rem; flex-wrap:wrap; gap:1rem; }
  .dash-header h1{ font-size:1.5rem; }
  .dash-header .who{ font-family:var(--font-mono); font-size:0.8rem; color:var(--text-faint); }

  .dash-tabs{ display:flex; gap:0.5rem; margin-bottom:1.8rem; flex-wrap:wrap; }
  .dash-tab{
    font-family:var(--font-mono); font-size:0.8rem; padding:0.55rem 1rem;
    border-radius:9px; border:1px solid var(--border); background:transparent;
    color:var(--text-dim); cursor:pointer; transition:all .2s;
  }
  .dash-tab.active, .dash-tab:hover{ border-color:var(--blue-bright); color:var(--blue-bright); }
  .dash-tab.active{ background:rgba(79,141,255,0.1); }

  .dash-panel{ display:none; }
  .dash-panel.active{ display:block; }

  .dash-grid{ display:grid; grid-template-columns:380px 1fr; gap:2rem; align-items:start; }
  @media (max-width:860px){ .dash-grid{ grid-template-columns:1fr; } }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.6rem; }
  .panel h2{ font-size:1.05rem; margin-bottom:1.2rem; }
  .dash-form{ display:flex; flex-direction:column; gap:0.95rem; }
  .dash-form label{ display:flex; flex-direction:column; gap:0.4rem; font-family:var(--font-mono); font-size:0.78rem; color:var(--text-dim); }
  .dash-form input, .dash-form textarea{
    background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding:0.7rem 0.85rem; color:var(--text); font-family:var(--font-body); font-size:0.92rem;
  }
  .dash-form input:focus, .dash-form textarea:focus{ outline:none; border-color:var(--blue-bright); }
  .dash-form textarea{ resize:vertical; }
  #imgPreview{ margin-top:0.5rem; max-height:140px; border-radius:8px; display:none; border:1px solid var(--border); }

  .admin-list{ display:flex; flex-direction:column; gap:0.9rem; }
  .admin-row{
    display:flex; gap:1rem; align-items:center; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:0.9rem 1rem;
  }
  .admin-row .thumb{ width:64px; height:64px; border-radius:8px; background:var(--surface-2); flex-shrink:0; overflow:hidden; }
  .admin-row .thumb img{ width:100%; height:100%; object-fit:cover; }
  .admin-row .meta{ flex:1; min-width:0; }
  .admin-row .meta h3{ font-size:0.95rem; }
  .admin-row .meta p{ font-size:0.8rem; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-actions{ display:flex; gap:0.5rem; flex-shrink:0; }
  .row-actions button{
    font-family:var(--font-mono); font-size:0.75rem; padding:0.4rem 0.7rem;
    border-radius:7px; border:1px solid var(--border); background:transparent; color:var(--text-dim); cursor:pointer;
  }
  .row-actions button:hover{ border-color:var(--blue-bright); color:var(--blue-bright); }
  .row-actions button.danger:hover{ border-color:#ff6b6b; color:#ff6b6b; }
  .btn-block{ width:100%; text-align:center; cursor:pointer; border:none; }
  .logout-btn{
    font-family:var(--font-mono); font-size:0.78rem; color:var(--text-faint);
    border:1px solid var(--border); padding:0.5rem 0.9rem; border-radius:8px; cursor:pointer; background:transparent;
  }
  .logout-btn:hover{ border-color:#ff6b6b; color:#ff6b6b; }
  .seed-btn{
    font-family:var(--font-mono); font-size:0.75rem; color:var(--cyan);
    border:1px dashed var(--border); padding:0.5rem 0.9rem; border-radius:8px;
    background:transparent; cursor:pointer; margin-bottom:1rem;
  }
  .seed-btn:hover{ border-color:var(--cyan); }
  .form-hint{ font-family:var(--font-mono); font-size:0.72rem; color:var(--text-faint); margin-top:-0.3rem; }
</style>
</head>
<body>
<canvas id="net-bg"></canvas>

<div class="dash-wrap">
  <div class="dash-header">
    <div>
      <h1>Portfolio dashboard</h1>
      <p class="who" id="whoami">checking session…</p>
    </div>
    <div style="display:flex; gap:0.8rem; align-items:center;">
      <a href="../index.html" class="nav-admin">view site ↗</a>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="dash-tabs">
    <button class="dash-tab active" data-panel="projects">Projects</button>
    <button class="dash-tab" data-panel="skills">Skills</button>
    <button class="dash-tab" data-panel="certs">Certifications</button>
  </div>

  <!-- PROJECTS -->
  <div class="dash-panel active" id="panel-projects">
    <div class="dash-grid">
      <div class="panel">
        <h2 id="formTitle">Add a project</h2>
        <form id="projectForm" class="dash-form">
          <input type="hidden" id="editId" value="" />
          <label>Title <input type="text" id="pTitle" required placeholder="MotoStock — Warehouse Inventory System" /></label>
          <label>Description <textarea id="pDescription" rows="4" required placeholder="What it does, the stack, and why it matters."></textarea></label>
          <label>Tech stack <input type="text" id="pTech" placeholder="Java, Spring Boot, MySQL (comma separated)" /></label>
          <label>GitHub URL <input type="url" id="pGithub" placeholder="https://github.com/you/repo" /></label>
          <label>Live demo URL <input type="url" id="pLive" placeholder="https://..." /></label>
          <label>
            Project image
            <input type="file" id="pImageFile" accept="image/*" />
          </label>
          <img id="imgPreview" alt="Preview" />
          <button type="submit" class="btn btn-primary btn-block" id="saveBtn">Save project</button>
          <button type="button" class="btn btn-ghost btn-block" id="cancelEditBtn" hidden>Cancel edit</button>
          <p class="form-status" id="dashStatus"></p>
        </form>
      </div>
      <div class="panel">
        <h2>Your projects</h2>
        <div class="admin-list" id="adminList">
          <p class="projects-empty">Loading…</p>
        </div>
      </div>
    </div>
  </div>

  <!-- SKILLS -->
  <div class="dash-panel" id="panel-skills">
    <div class="dash-grid">
      <div class="panel">
        <h2 id="skillFormTitle">Add skill category</h2>
        <form id="skillForm" class="dash-form">
          <input type="hidden" id="skillEditId" value="" />
          <label>Category title <input type="text" id="skillTitle" required placeholder="Backend" /></label>
          <label>
            Skills
            <textarea id="skillItems" rows="5" required placeholder="Java, Spring Boot, REST API (one per line or comma separated)"></textarea>
            <span class="form-hint">Separate with commas or new lines</span>
          </label>
          <label>Display order <input type="number" id="skillOrder" min="0" value="0" /></label>
          <button type="submit" class="btn btn-primary btn-block" id="saveSkillBtn">Save category</button>
          <button type="button" class="btn btn-ghost btn-block" id="cancelSkillEditBtn" hidden>Cancel edit</button>
          <p class="form-status" id="skillStatus"></p>
        </form>
      </div>
      <div class="panel">
        <h2>Skill categories</h2>
        <button type="button" class="seed-btn" id="seedSkillsBtn">Seed default skills</button>
        <div class="admin-list" id="skillList">
          <p class="projects-empty">Loading…</p>
        </div>
      </div>
    </div>
  </div>

  <!-- CERTIFICATIONS -->
  <div class="dash-panel" id="panel-certs">
    <div class="dash-grid">
      <div class="panel">
        <h2 id="certFormTitle">Add certification</h2>
        <form id="certForm" class="dash-form">
          <input type="hidden" id="certEditId" value="" />
          <label>Certification name <input type="text" id="certName" required placeholder="Cisco CCNA" /></label>
          <label>Year <input type="text" id="certYear" placeholder="2025" /></label>
          <label>Display order <input type="number" id="certOrder" min="0" value="0" /></label>
          <button type="submit" class="btn btn-primary btn-block" id="saveCertBtn">Save certification</button>
          <button type="button" class="btn btn-ghost btn-block" id="cancelCertEditBtn" hidden>Cancel edit</button>
          <p class="form-status" id="certStatus"></p>
        </form>
      </div>
      <div class="panel">
        <h2>Certifications</h2>
        <button type="button" class="seed-btn" id="seedCertsBtn">Seed default certifications</button>
        <div class="admin-list" id="certList">
          <p class="projects-empty">Loading…</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/main.js"></script>
<script src="../js/admin-dashboard.js"></script>
</body>
</html>
